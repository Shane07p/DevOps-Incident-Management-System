name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only for the coverage comment on pull requests.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # The runner already provides Docker, so Testcontainers tests run here. verify also fails if line or branch
      # coverage drops below the floors in pom.xml (jacoco check).
      - name: Build and test
        working-directory: backend
        run: ./mvnw -B verify

      # PIT mutates the lifecycle and SLA rules and fails below the mutation threshold in pom.xml.
      - name: Mutation tests
        working-directory: backend
        run: ./mvnw -B org.pitest:pitest-maven:mutationCoverage

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-mutation
          path: backend/target/pit-reports/
          if-no-files-found: ignore

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

      # Posts overall and changed-file coverage on the PR, also when a gate failed. The comment only reports: the
      # floors that fail the build are in pom.xml.
      - name: Comment coverage on the pull request
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920 # v1.8.0
        with:
          paths: ${{ github.workspace }}/backend/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Backend coverage
          update-comment: true
          comment-type: both
          min-coverage-overall: 0
          min-coverage-changed-files: 0

  frontend:
    name: Frontend build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Unit tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore

      - name: Build
        working-directory: frontend
        run: npm run build

  ai-service:
    name: AI service build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements-dev.txt

      - name: Install dependencies
        working-directory: ai-service
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        working-directory: ai-service
        run: pytest

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-service-coverage
          path: ai-service/htmlcov/
          if-no-files-found: ignore

  demo-shop:
    name: Demo shop build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: demo-shop/requirements-dev.txt

      - name: Install dependencies
        working-directory: demo-shop
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        working-directory: demo-shop
        run: pytest

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: demo-shop-coverage
          path: demo-shop/htmlcov/
          if-no-files-found: ignore

  e2e:
    name: Cypress E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Start the Compose stack
        run: docker compose --profile app up -d --build
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Wait for backend health check
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1 && curl -sf http://localhost:8081/ > /dev/null 2>&1; then
              echo "Backend and frontend are ready"
              exit 0
            fi
            echo "Waiting for app stack… ($i/30)"
            sleep 5
          done
          echo "::error::Backend did not become healthy in time"
          exit 1

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Cypress E2E tests
        working-directory: frontend
        run: npx cypress run --config baseUrl=http://localhost:8081

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots/
          if-no-files-found: ignore

      - name: Upload Cypress videos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-videos
          path: frontend/cypress/videos/
          if-no-files-found: ignore

      - name: Tear down Compose stack
        if: always()
        run: docker compose --profile app down -v

  demo-warmup:
    name: Demo warm-up checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check script syntax and exit-code regressions
        run: |
          bash -n scripts/demo-warmup.sh
          bash -n scripts/test_demo_warmup.sh
          bash scripts/test_demo_warmup.sh

  # A token, key, or password committed anywhere in the history fails the build (.gitleaks.toml lists what is allowed).
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o gitleaks.tar.gz "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "_linux_x64.tar.gz" checksums.txt | sed 's#  .*#  gitleaks.tar.gz#' | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      # --redact keeps any finding's value out of the log.
      - name: Scan every commit
        run: ./gitleaks git --redact --no-banner .

  # The AGENTS.md rules that only the pull request's history can show.
  repository-rules:
    name: Repository rules
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BASE: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Broken links or anchors, Passed rows without a date and commit, unknown test case IDs (docs/README.md).
      - name: Docs are consistent
        run: python3 scripts/check_docs.py

      # Flyway checksums every applied migration, so editing one breaks every database that ran it.
      - name: Applied migrations are unchanged
        run: |
          changed=$(git diff --name-only --diff-filter=MDR "$BASE...HEAD" -- backend/src/main/resources/db/migration/)
          if [ -n "$changed" ]; then
            echo "::error::A migration already on main was changed. Add a new V file instead."
            echo "$changed"
            exit 1
          fi
