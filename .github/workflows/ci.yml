name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only for the coverage comment on pull requests.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # The runner already provides Docker, so Testcontainers tests run here.
      - name: Build and test
        working-directory: backend
        run: ./mvnw -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

      # Posts overall and changed-file coverage on the PR. No minimum is set, so it never fails the build.
      - name: Comment coverage on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920 # v1.8.0
        with:
          paths: ${{ github.workspace }}/backend/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Backend coverage
          update-comment: true
          comment-type: both
          min-coverage-overall: 0
          min-coverage-changed-files: 0

  frontend:
    name: Frontend build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Unit tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore

      - name: Build
        working-directory: frontend
        run: npm run build

  ai-service:
    name: AI service build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements-dev.txt

      - name: Install dependencies
        working-directory: ai-service
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: ai-service
        run: pytest

  demo-shop:
    name: Demo shop build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: demo-shop/requirements-dev.txt

      - name: Install dependencies
        working-directory: demo-shop
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: demo-shop
        run: pytest

  # The AGENTS.md rules that only the pull request's history can show.
  repository-rules:
    name: Repository rules
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BASE: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Flyway checksums every applied migration, so editing one breaks every database that ran it.
      - name: Applied migrations are unchanged
        run: |
          changed=$(git diff --name-only --diff-filter=MDR "$BASE...HEAD" -- backend/src/main/resources/db/migration/)
          if [ -n "$changed" ]; then
            echo "::error::A migration already on main was changed. Add a new V file instead."
            echo "$changed"
            exit 1
          fi

      - name: No AI co-author lines
        run: |
          if git log --format=%B "$BASE..HEAD" | grep -iE '^co-authored-by:.*(claude|anthropic|copilot|gemini|openai|chatgpt|codex|cursor|devin)'; then
            echo "::error::Remove the Co-Authored-By lines for AI tools (AGENTS.md)."
            exit 1
          fi
