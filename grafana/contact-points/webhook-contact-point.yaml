# Grafana contact points, payload template, and notification policy (D36)
# ------------------------------------------------------------------------
# In Grafana's file-provisioning format (contactPoints, templates, policies).
#
# One webhook contact point per rule type, each with its own tool token: register
# three tools in Settle (POST /api/tools) and put each token in its own variable. Grafana
# sends the token in the Authorization header, never in the URL.
#
# The "settle.alert" template turns one firing alert into our AlertRequest:
#   source          grafana-down | grafana-degraded | grafana-error_rate
#   eventId         gf-<fingerprint>-<startsAt, Unix seconds>: the same while one outage
#                   lasts (repeats are counted once), new for the next outage
#   service         the rule's `service` label; a Settle service of that name must exist
#   correlationKey  grafana-<rule_type>-<service>: alerts of one outage join one incident
# Nothing in the body changes between repeats (no values, no times other than startsAt),
# because intake answers 409 when a known eventId comes back with a different body.
#
# Resolved notifications are not sent (disableResolveMessage): Settle resolves incidents
# through its own status flow, not from Grafana.

apiVersion: 1

templates:
  - orgId: 1
    name: settle-alert
    template: |
      {{ define "settle.alert" -}}
      {{- range $i, $alert := .Alerts.Firing -}}
      {{- if eq $i 0 -}}
      {{- $severity := "SEV3" -}}
      {{- if eq $alert.Labels.severity "critical" }}{{ $severity = "SEV1" }}{{ else if eq $alert.Labels.severity "warning" }}{{ $severity = "SEV2" }}{{ end -}}
      {{- coll.Dict
            "source" (printf "grafana-%s" $alert.Labels.rule_type)
            "eventId" (printf "gf-%s-%d" $alert.Fingerprint $alert.StartsAt.Unix)
            "service" $alert.Labels.service
            "title" $alert.Annotations.summary
            "description" $alert.Annotations.description
            "severity" $severity
            "correlationKey" (printf "grafana-%s-%s" $alert.Labels.rule_type $alert.Labels.service)
            "details" (coll.Dict "rule" $alert.Labels.alertname "ruleType" $alert.Labels.rule_type "fingerprint" $alert.Fingerprint)
          | data.ToJSON -}}
      {{- end -}}
      {{- end -}}
      {{- end }}

contactPoints:
  - orgId: 1
    name: settle-down
    receivers:
      - uid: settle-down
        type: webhook
        disableResolveMessage: true
        settings:
          url: "${SETTLE_BACKEND_URL}/webhooks/alerts"
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: "${SETTLE_DOWN_TOOL_TOKEN}"
          payload:
            template: '{{ template "settle.alert" . }}'

  - orgId: 1
    name: settle-degraded
    receivers:
      - uid: settle-degraded
        type: webhook
        disableResolveMessage: true
        settings:
          url: "${SETTLE_BACKEND_URL}/webhooks/alerts"
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: "${SETTLE_DEGRADED_TOOL_TOKEN}"
          payload:
            template: '{{ template "settle.alert" . }}'

  - orgId: 1
    name: settle-error-rate
    receivers:
      - uid: settle-error-rate
        type: webhook
        disableResolveMessage: true
        settings:
          url: "${SETTLE_BACKEND_URL}/webhooks/alerts"
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: "${SETTLE_ERROR_RATE_TOOL_TOKEN}"
          payload:
            template: '{{ template "settle.alert" . }}'

# Importing `policies` replaces the org's whole notification policy tree. The root keeps
# Grafana's default email contact point; only the demo-shop rules (team=group2) go to Settle.
# Grouping by alertname (one rule each) puts one alert in each notification, which is what
# the template posts.
policies:
  - orgId: 1
    receiver: grafana-default-email
    group_by: [grafana_folder, alertname]
    routes:
      - receiver: settle-down
        object_matchers:
          - [team, "=", group2]
          - [rule_type, "=", down]
        group_by: [alertname]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
      - receiver: settle-degraded
        object_matchers:
          - [team, "=", group2]
          - [rule_type, "=", degraded]
        group_by: [alertname]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
      - receiver: settle-error-rate
        object_matchers:
          - [team, "=", group2]
          - [rule_type, "=", error_rate]
        group_by: [alertname]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
