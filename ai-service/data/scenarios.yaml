# Demo Shop Scenarios (Machine-Readable Contract)
# Issue #64 / Issue #76 / Decision D40
# Authoritative specification of the 5 demo-shop fault scenarios.

scenarios:
  - id: SCN-01
    name: Slow Gateway
    switch: slow_gateway
    service: payments
    what_it_breaks: Adds 2.0s bounded latency to the payment authorization path, causing checkout latency spikes and client timeouts.
    expected_signals:
      monitor: Payments and checkout HTTP latency monitors exceed threshold (>1.5s).
      metrics:
        - demo_http_request_duration_seconds
        - demo_fault_active{fault="slow_gateway"}
      log_pattern: "WARN/ERROR payment.gateway.slow latency_ms=..."
      deploy_event: null
    root_cause: Downstream payment gateway network degradation causing severe latency.
    ai_hypothesis: Downstream payment gateway latency causing connection backpressure and checkout timeouts.

  - id: SCN-02
    name: Error Spike
    switch: error_spike
    service: checkout
    what_it_breaks: Injects simulated internal errors into checkout transactions, causing ~80% of checkout requests to fail with HTTP 500.
    expected_signals:
      monitor: Checkout monitor reports consecutive HTTP 500 errors.
      metrics:
        - demo_http_requests_total{status="500"}
        - demo_fault_active{fault="error_spike"}
      log_pattern: "ERROR checkout.transaction_failed error='simulated database deadlock on orders'"
      deploy_event: null
    root_cause: Unhandled internal database deadlock in checkout transaction block.
    ai_hypothesis: Unhandled internal exception in checkout transaction block causing error rate surge.

  - id: SCN-03
    name: Bad Deploy
    switch: bad_deploy
    service: checkout
    what_it_breaks: Simulates a faulty software release (v1.0.1-broken), causing immediate checkout request failures and emitting a structured deploy event.
    expected_signals:
      monitor: Checkout monitor detects sudden failure immediately after deploy timestamp.
      metrics:
        - demo_deploy_events_total{service="checkout",version="v1.0.1-broken"}
        - demo_http_requests_total{status="500",version="v1.0.1-broken"}
        - demo_fault_active{fault="bad_deploy"}
      log_pattern: "deploy.event service=checkout version=v1.0.1-broken followed by ERROR checkout.null_pointer_exception"
      deploy_event:
        service: checkout
        version: v1.0.1-broken
        previous_version: v1.0.0
        commit: a1b2c3d
        author: ci-bot
    root_cause: Faulty code release v1.0.1-broken deployed to checkout service.
    ai_hypothesis: Regression defect introduced in release v1.0.1-broken deployed at timestamp.

  - id: SCN-04
    name: Queue Backlog
    switch: queue_backlog
    service: order-fulfillment
    what_it_breaks: Pauses asynchronous order fulfillment queue processing while new orders arrive, causing queue depth and processing lag to accumulate.
    expected_signals:
      monitor: Order fulfillment queue depth and processing lag monitor alerts.
      metrics:
        - demo_queue_depth
        - demo_queue_lag_seconds
        - demo_fault_active{fault="queue_backlog"}
      log_pattern: "WARN queue.backlog_warning depth=... lag_seconds=... message='Worker paused: order backlog growing'"
      deploy_event: null
    root_cause: Asynchronous queue worker thread paused, halting message consumption.
    ai_hypothesis: Asynchronous queue worker stall causing order processing queue depth accumulation.

  - id: SCN-05
    name: Expiring Certificate
    switch: expiring_certificate
    service: payments
    what_it_breaks: Simulates an expiring/expired TLS certificate on the external payment gateway endpoint, dropping remaining validity to 0 days and emitting SSL handshake alerts.
    expected_signals:
      monitor: SSL certificate monitor alerts on certificate expiration (0 days remaining).
      metrics:
        - demo_certificate_days_until_expiry
        - demo_ssl_errors_total
        - demo_fault_active{fault="expiring_certificate"}
      log_pattern: "WARN/ERROR ssl.cert_expiring host='gateway.payments.internal' days_remaining=0"
      deploy_event: null
    root_cause: TLS certificate on gateway.payments.internal expired without automatic renewal.
    ai_hypothesis: TLS/SSL certificate expiration on payment gateway endpoint causing handshake failures.
