
schema_version: 1

scenarios:
  - scenario_id: SCN-01
    switch: slow_gateway
    service: payments
    what_it_breaks: "Adds approximately 2 seconds of latency to /payments/authorize."
    expected_signals:
      monitor: "HTTP response-time monitor for /payments/authorize reports elevated latency."
      metric: "demo_http_request_duration_seconds increases for the payments authorization endpoint."
      log_pattern: "payment.gateway.slow"
      deploy_event: "No deploy event is expected for this scenario."
    real_cause: "Artificially injected 2-second delay in the payment gateway."
    ai_first_hypothesis: "Payment gateway latency degradation."

  - scenario_id: SCN-02
    switch: error_spike
    service: checkout
    what_it_breaks: "Approximately 80% of checkout requests fail with HTTP 500."
    expected_signals:
      monitor: "Checkout HTTP monitor observes increased HTTP 500 responses."
      metric: "demo_http_requests_total reflects increased failed checkout requests."
      log_pattern: "checkout.transaction_failed"
      deploy_event: "No deploy event is expected for this scenario."
    real_cause: "Simulated database deadlocks during checkout transactions."
    ai_first_hypothesis: "Database transaction deadlocks are causing checkout failures."

  - scenario_id: SCN-03
    switch: bad_deploy
    service: checkout
    what_it_breaks: "Deploys v1.0.1-broken and causes checkout requests to fail with a NullPointerException."
    expected_signals:
      monitor: "Checkout HTTP monitor observes HTTP 500 responses after the deployment."
      metric: "demo_http_requests_total reflects failed checkout requests."
      log_pattern: "checkout.null_pointer_exception and deploy.event"
      deploy_event: "A completed deployment event for v1.0.1-broken is emitted for checkout."
    real_cause: "A faulty deployment of checkout version v1.0.1-broken."
    ai_first_hypothesis: "A recent checkout deployment introduced a regression."

  - scenario_id: SCN-04
    switch: queue_backlog
    service: order-fulfillment
    what_it_breaks: "Pauses the order fulfillment worker, causing queued orders to accumulate."
    expected_signals:
      monitor: "Queue depth and processing lag monitoring indicate a growing backlog."
      metric: "demo_queue_depth and demo_queue_lag_seconds increase."
      log_pattern: "queue.paused and queue.backlog_warning"
      deploy_event: "No deploy event is expected for this scenario."
    real_cause: "The background order fulfillment worker is paused."
    ai_first_hypothesis: "The order fulfillment worker is stalled or paused."

  - scenario_id: SCN-05
    switch: expiring_certificate
    service: payments
    what_it_breaks: "Sets the payment gateway certificate validity to zero days and produces SSL warnings/errors."
    expected_signals:
      monitor: "SSL certificate monitoring reports an expired or zero-day certificate."
      metric: "demo_ssl_errors_total increases and demo_certificate_days_until_expiry reaches zero."
      log_pattern: "ssl.cert_expiring and ssl.handshake_warning"
      deploy_event: "No deploy event is expected for this scenario."
    real_cause: "The simulated payment gateway TLS certificate has expired."
    ai_first_hypothesis: "Payment gateway TLS certificate expiry."
