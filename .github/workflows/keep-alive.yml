name: Demo Keep-Alive and Telemetry Warmup

# A 12-hour cron keeps Supabase from auto-pausing (7-day inactivity limit) and keeps
# Grafana Cloud telemetry fresh (14-day retention limit).
#
# Note on Render free-tier cold starts:
# Render free-tier web services sleep after 15 minutes of inactivity, so this 12-hour cron
# does NOT prevent Render cold starts during the viva. To eliminate cold starts before the
# live evaluation, run scripts/demo-warmup.sh manually right before the demo (T-15 minutes).

on:
  schedule:
    # Runs every 12 hours (00:00 and 12:00 UTC) to keep Supabase awake and refresh Grafana retention
    - cron: '0 0,12 * * *'
  workflow_dispatch:
    inputs:
      warmup_traffic_seconds:
        description: 'Duration (seconds) of demo traffic to generate'
        required: false
        default: '30'

concurrency:
  group: keep-alive-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  warmup:
    name: Keep Supabase active and refresh Grafana telemetry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate repository variables
        env:
          RENDER_BACKEND_URL: ${{ vars.RENDER_BACKEND_URL }}
          AI_SERVICE_URL: ${{ vars.AI_SERVICE_URL }}
          VERCEL_FRONTEND_URL: ${{ vars.VERCEL_FRONTEND_URL }}
          DEMO_SHOP_URL: ${{ vars.DEMO_SHOP_URL }}
        run: |
          missing=()
          [ -z "$RENDER_BACKEND_URL" ] && missing+=("vars.RENDER_BACKEND_URL")
          [ -z "$AI_SERVICE_URL" ] && missing+=("vars.AI_SERVICE_URL")
          [ -z "$VERCEL_FRONTEND_URL" ] && missing+=("vars.VERCEL_FRONTEND_URL")
          [ -z "$DEMO_SHOP_URL" ] && missing+=("vars.DEMO_SHOP_URL")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required repository variable(s): ${missing[*]}"
            echo "Configure RENDER_BACKEND_URL, AI_SERVICE_URL, VERCEL_FRONTEND_URL, and DEMO_SHOP_URL in Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi

      - name: Run warmup script
        env:
          BACKEND_URL: ${{ vars.RENDER_BACKEND_URL }}
          AI_SERVICE_URL: ${{ vars.AI_SERVICE_URL }}
          FRONTEND_URL: ${{ vars.VERCEL_FRONTEND_URL }}
          DEMO_SHOP_URL: ${{ vars.DEMO_SHOP_URL }}
          DEMO_SHOP_TRAFFIC_TARGET_URL: ${{ vars.DEMO_SHOP_TRAFFIC_TARGET_URL }}
          DEMO_SHOP_CONTROL_TOKEN: ${{ secrets.DEMO_SHOP_CONTROL_TOKEN }}
          WARMUP_TRAFFIC_SECONDS: ${{ github.event.inputs.warmup_traffic_seconds || '30' }}
        run: |
          chmod +x scripts/demo-warmup.sh
          ./scripts/demo-warmup.sh
