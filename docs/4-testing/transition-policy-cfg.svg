<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" font-family="Helvetica, Arial, sans-serif" font-size="13">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#333"/></marker></defs>
<text x="20" y="28" font-size="16" font-weight="bold">TransitionPolicy.isLegal(from, to): control-flow graph</text>
<text x="20" y="48" fill="#555">10 decisions (2 null checks, 6 switch branches, 2 short-circuit ORs), so V(G) = 10 + 1 = 11 independent paths, P1 to P11.</text>
<rect x="430" y="70" width="120" height="30" rx="6" fill="#f7f7f7" stroke="#555"/>
<text x="490.0" y="89.0" text-anchor="middle">entry</text>
<polygon points="490.0,120 570,148.0 490.0,176 410,148.0" fill="#eef3ff" stroke="#335"/>
<text x="490.0" y="152.0" text-anchor="middle">from == null ?</text>
<polygon points="490.0,196 570,224.0 490.0,252 410,224.0" fill="#eef3ff" stroke="#335"/>
<text x="490.0" y="228.0" text-anchor="middle">to == null ?</text>
<rect x="720" y="130" width="130" height="34" rx="6" fill="#f7f7f7" stroke="#555"/>
<text x="785.0" y="151.0" text-anchor="middle">return false</text>
<line x1="490" y1="100" x2="490" y2="120" stroke="#333" marker-end="url(#a)"/>
<line x1="570" y1="148" x2="720" y2="147" stroke="#333" marker-end="url(#a)"/>
<text x="651.0" y="147.5" fill="#1a5" font-size="12">yes (P1)</text>
<line x1="490" y1="176" x2="490" y2="196" stroke="#333" marker-end="url(#a)"/>
<text x="496.0" y="186.0" fill="#1a5" font-size="12">no</text>
<line x1="570" y1="224" x2="720" y2="160" stroke="#333" marker-end="url(#a)"/>
<text x="640" y="205" fill="#1a5" font-size="12">yes (P2)</text>
<polygon points="490.0,276 580,304.0 490.0,332 400,304.0" fill="#eef3ff" stroke="#335"/>
<text x="490.0" y="308.0" text-anchor="middle">switch (from)</text>
<line x1="490" y1="252" x2="490" y2="276" stroke="#333" marker-end="url(#a)"/>
<text x="496.0" y="264.0" fill="#1a5" font-size="12">no</text>
<line x1="490" y1="332" x2="76" y2="380" stroke="#333" marker-end="url(#a)"/>
<text x="24" y="374" fill="#335" font-size="11">OPEN</text>
<rect x="20" y="384" width="116" height="34" rx="6" fill="#f7f7f7" stroke="#555"/>
<text x="78.0" y="405.0" text-anchor="middle">to == ACKNOWLEDGED</text>
<text x="78" y="436" text-anchor="middle" fill="#1a5" font-size="12">P3</text>
<line x1="78" y1="418" x2="490" y2="556" stroke="#333" marker-end="url(#a)"/>
<line x1="490" y1="332" x2="214" y2="380" stroke="#333" marker-end="url(#a)"/>
<text x="162" y="374" fill="#335" font-size="11">ACKNOWLEDGED</text>
<rect x="158" y="384" width="116" height="34" rx="6" fill="#f7f7f7" stroke="#555"/>
<text x="216.0" y="405.0" text-anchor="middle">to == INVESTIGATING</text>
<text x="216" y="436" text-anchor="middle" fill="#1a5" font-size="12">P4</text>
<line x1="216" y1="418" x2="490" y2="556" stroke="#333" marker-end="url(#a)"/>
<line x1="490" y1="332" x2="352" y2="380" stroke="#333" marker-end="url(#a)"/>
<text x="300" y="374" fill="#335" font-size="11">INVESTIGATING</text>
<line x1="490" y1="332" x2="490" y2="380" stroke="#333" marker-end="url(#a)"/>
<text x="438" y="374" fill="#335" font-size="11">IDENTIFIED</text>
<rect x="434" y="384" width="116" height="34" rx="6" fill="#f7f7f7" stroke="#555"/>
<text x="492.0" y="405.0" text-anchor="middle">to == MONITORING</text>
<text x="492" y="436" text-anchor="middle" fill="#1a5" font-size="12">P7</text>
<line x1="492" y1="418" x2="490" y2="556" stroke="#333" marker-end="url(#a)"/>
<line x1="490" y1="332" x2="628" y2="380" stroke="#333" marker-end="url(#a)"/>
<text x="576" y="374" fill="#335" font-size="11">MONITORING</text>
<line x1="490" y1="332" x2="766" y2="380" stroke="#333" marker-end="url(#a)"/>
<text x="714" y="374" fill="#335" font-size="11">RESOLVED</text>
<rect x="710" y="384" width="116" height="34" rx="6" fill="#f7f7f7" stroke="#555"/>
<text x="768.0" y="405.0" text-anchor="middle">to == CLOSED</text>
<text x="768" y="436" text-anchor="middle" fill="#1a5" font-size="12">P10</text>
<line x1="768" y1="418" x2="490" y2="556" stroke="#333" marker-end="url(#a)"/>
<line x1="490" y1="332" x2="904" y2="380" stroke="#333" marker-end="url(#a)"/>
<text x="852" y="374" fill="#335" font-size="11">CLOSED</text>
<rect x="848" y="384" width="116" height="34" rx="6" fill="#f7f7f7" stroke="#555"/>
<text x="906.0" y="405.0" text-anchor="middle">false</text>
<text x="906" y="436" text-anchor="middle" fill="#1a5" font-size="12">P11</text>
<line x1="906" y1="418" x2="490" y2="556" stroke="#333" marker-end="url(#a)"/>
<polygon points="354.0,384 422,408.0 354.0,432 286,408.0" fill="#eef3ff" stroke="#335"/>
<text x="354.0" y="412.0" text-anchor="middle">to == IDENTIFIED ?</text>
<rect x="296" y="470" width="116" height="34" rx="6" fill="#f7f7f7" stroke="#555"/>
<text x="354.0" y="491.0" text-anchor="middle">to==MONITORING</text>
<line x1="354" y1="432" x2="354" y2="470" stroke="#333" marker-end="url(#a)"/>
<text x="360" y="456" fill="#1a5" font-size="12">no (P6)</text>
<line x1="422" y1="408" x2="490" y2="556" stroke="#333" marker-end="url(#a)"/>
<text x="426" y="470" fill="#1a5" font-size="12">yes (P5)</text>
<line x1="354" y1="504" x2="490" y2="556" stroke="#333" marker-end="url(#a)"/>
<polygon points="630.0,384 698,408.0 630.0,432 562,408.0" fill="#eef3ff" stroke="#335"/>
<text x="630.0" y="412.0" text-anchor="middle">to == INVESTIGATING ?</text>
<rect x="572" y="470" width="116" height="34" rx="6" fill="#f7f7f7" stroke="#555"/>
<text x="630.0" y="491.0" text-anchor="middle">to==RESOLVED</text>
<line x1="630" y1="432" x2="630" y2="470" stroke="#333" marker-end="url(#a)"/>
<text x="636" y="456" fill="#1a5" font-size="12">no (P9)</text>
<line x1="698" y1="408" x2="490" y2="556" stroke="#333" marker-end="url(#a)"/>
<text x="702" y="470" fill="#1a5" font-size="12">yes (P8)</text>
<line x1="630" y1="504" x2="490" y2="556" stroke="#333" marker-end="url(#a)"/>
<rect x="430" y="556" width="120" height="34" rx="6" fill="#f7f7f7" stroke="#555"/>
<text x="490.0" y="577.0" text-anchor="middle">return result</text>
<line x1="785" y1="164" x2="520" y2="556" stroke="#333" marker-end="url(#a)"/>
</svg>
