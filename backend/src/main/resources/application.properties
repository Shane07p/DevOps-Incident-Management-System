spring.application.name=incident-management

# Render (and similar hosts) tell the app which port to use through PORT.
server.port=${PORT:8080}

# Credentials come from the environment; nothing real belongs in this file.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/incident}
spring.datasource.username=${DB_USERNAME:incident}
spring.datasource.password=${DB_PASSWORD:incident}

# Connection pool (D43). Keep the maximum below the Supabase session pooler's client limit, with room
# for Flyway and the SQL editor. The defaults are HikariCP's own; leak detection is off unless set.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.leak-detection-threshold=${DB_POOL_LEAK_DETECTION_MS:0}

# Flyway owns the schema. JPA only checks that the mapping matches it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
# Dev seed data is opt-in (D27): only FLYWAY_LOCATIONS=classpath:db/migration,classpath:db/devdata
# loads it. Production leaves FLYWAY_LOCATIONS unset or migration-only.
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}
# Lets a database that once loaded the dev seed start without it. This skips validation for any
# repeatable migration that has gone missing, not only the seed, and the seed's rows stay.
spring.flyway.ignore-migration-patterns=*:future,repeatable:missing
# Our tables live in their own schema, apart from what hosts like Supabase keep in "public".
spring.flyway.schemas=incident
spring.datasource.hikari.schema=incident
spring.jpa.properties.hibernate.default_schema=incident

# Signs login tokens: base64, at least 32 bytes (openssl rand -base64 32). Blank means a random key
# per start, so tokens stop working on restart.
app.jwt.secret=${JWT_SECRET:}

# AI-1 embeddings are optional; incident creation remains available when the service is unset.
app.ai.service-url=${AI_SERVICE_URL:}
app.ai.embedding.timeout=${AI_SERVICE_TIMEOUT:5s}
app.ai.investigation.timeout=${AI_INVESTIGATION_TIMEOUT:20s}
app.ai.draft.timeout=${AI_DRAFT_TIMEOUT:20s}

# Every timestamp is stored and compared in UTC.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Rate limits (D42, NFR-04.4)
app.rate-limit.login.capacity=${RATE_LIMIT_LOGIN_CAPACITY:5}
app.rate-limit.login.duration=${RATE_LIMIT_LOGIN_DURATION:60s}
app.rate-limit.webhook.capacity=${RATE_LIMIT_WEBHOOK_CAPACITY:50}
app.rate-limit.webhook.duration=${RATE_LIMIT_WEBHOOK_DURATION:1s}
app.rate-limit.pat.capacity=${RATE_LIMIT_PAT_CAPACITY:60}
app.rate-limit.pat.duration=${RATE_LIMIT_PAT_DURATION:60s}
app.rate-limit.max-buckets=${RATE_LIMIT_MAX_BUCKETS:10000}
# Tomcat takes the client's address from X-Forwarded-For when the connection comes from a trusted
# proxy (private addresses by default: nginx in Compose, a cloud load balancer), and ignores it otherwise.
server.forward-headers-strategy=native

# RabbitMQ (D24, #82): escalation and notification events leave through the outbox. With RABBITMQ_URL
# unset, nothing connects to RabbitMQ and the events wait in the outbox. The health check leaves
# RabbitMQ out, so the app reports healthy while the queue is down.
spring.rabbitmq.addresses=${RABBITMQ_URL:}
# Correlated confirms with mandatory returns: the relay marks an event SENT only once a queue took it.
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
management.health.rabbit.enabled=false
app.outbox.relay-delay-ms=${OUTBOX_RELAY_DELAY_MS:5000}

# Uptime monitors (FR-22). Each monitor's own interval decides when it is due; this is how often the
# worker looks. MONITORS_ALLOW_PRIVATE_TARGETS=true lets a local run check localhost; leave it off elsewhere.
app.monitors.worker-delay-ms=${MONITORS_WORKER_DELAY_MS:10000}
app.monitors.allow-private-targets=${MONITORS_ALLOW_PRIVATE_TARGETS:false}
app.heartbeats.worker-delay-ms=${HEARTBEATS_WORKER_DELAY_MS:10000}
# The monitor checks, escalations, and the outbox relay each get a scheduler thread, so a pass over
# slow monitors cannot hold up an escalation (FR-07.6). Spring Boot's default is one thread for all.
spring.task.scheduling.pool.size=3

# Grafana Cloud (Loki and Prometheus, D34, FR-26, FR-27, #156)
grafana.prometheus.url=${GRAFANA_PROMETHEUS_URL:}
grafana.prometheus.user=${GRAFANA_PROMETHEUS_USER:}
grafana.loki.url=${GRAFANA_LOKI_URL:}
grafana.loki.user=${GRAFANA_LOKI_USER:}
grafana.read-token=${GRAFANA_READ_TOKEN:}
grafana.timeout-seconds=${GRAFANA_TIMEOUT_SECONDS:5}

