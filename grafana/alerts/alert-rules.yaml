          team: group2
        annotations:
          summary: "Checkout is down"
          description: "At least 2 locations failed the checkout check on 2 checks in a row."
        notification_settings:
          receiver: settle-down
          group_by: [grafana_folder, alertname]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h

      - uid: demo-shop-down-search
