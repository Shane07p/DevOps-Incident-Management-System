# Local development stack. `docker compose up -d db` is enough for day-to-day work;
# the `app` profile runs the packaged backend and the built UI behind nginx on http://localhost:8081.
services:
  db:
    image: postgres:16
    container_name: incident-db
    environment:
      POSTGRES_DB: ${DB_NAME:-incident}
      POSTGRES_USER: ${DB_USERNAME:-incident}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-incident}
      TZ: UTC
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - incident-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-incident} -d ${DB_NAME:-incident}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    profiles: [ "app" ]
    build:
      context: ./backend
    container_name: incident-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-incident}
      DB_USERNAME: ${DB_USERNAME:-incident}
      DB_PASSWORD: ${DB_PASSWORD:-incident}
      # Migrations only, unless .env opts in to the dev seed (D27).
      FLYWAY_LOCATIONS: ${FLYWAY_LOCATIONS:-classpath:db/migration}
      JWT_SECRET: ${JWT_SECRET:-}
      # Empty: events wait in the outbox. With the queue profile: amqp://settle:<password>@rabbitmq:5672
      RABBITMQ_URL: ${RABBITMQ_URL:-}
      TZ: UTC
    ports:
      - "${APP_PORT:-8080}:8080"

  # The way in when the stack runs in Docker (D41): nginx serves the UI and proxies the backend.
  web:
    profiles: [ "app" ]
    build:
      context: ./frontend
    container_name: incident-web
    depends_on:
      - app
    ports:
      - "${WEB_PORT:-8081}:80"

  ai-service:
    profiles: [ "ai" ]
    build:
      context: ./ai-service
    container_name: incident-ai
    depends_on:
      - ollama
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-10}
      AGENT_MODEL: ${AGENT_MODEL:-qwen2.5:0.5b}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-5}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-15.0}
      AGENT_MAX_TOKENS: ${AGENT_MAX_TOKENS:-4000}
    ports:
      - "127.0.0.1:${AI_PORT:-8000}:8000"

  # Escalation and notification events (D24, #82). Production uses a hosted instance instead.
  rabbitmq:
    profiles: [ "queue" ]
    image: rabbitmq:4.4.0-management
    container_name: incident-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-settle}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-settle}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      # Management UI: http://localhost:15672
      - "127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - incident-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      retries: 5

  ollama:
    profiles: [ "ai", "ollama" ]
    image: ollama/ollama:0.40.8
    container_name: incident-ollama
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - incident-ollama-data:/root/.ollama

  demo-shop:
    profiles: ["demo"]
    build:
      context: ./demo-shop
    container_name: incident-demo-shop
    environment:
      PORT: 8001
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    ports:
      - "127.0.0.1:${DEMO_SHOP_PORT:-8001}:8001"

volumes:
  incident-db-data:
  incident-ollama-data:
  incident-rabbitmq-data:
