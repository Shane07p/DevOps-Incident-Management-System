spring.application.name=incident-management

# Render (and similar hosts) tell the app which port to use through PORT.
server.port=${PORT:8080}

# Credentials come from the environment; nothing real belongs in this file.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/incident}
spring.datasource.username=${DB_USERNAME:incident}
spring.datasource.password=${DB_PASSWORD:incident}

# Connection pool (D43). Keep the maximum below the Supabase session pooler's client limit, with room
# for Flyway and the SQL editor. The defaults are HikariCP's own; leak detection is off unless set.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.leak-detection-threshold=${DB_POOL_LEAK_DETECTION_MS:0}

# Flyway owns the schema. JPA only checks that the mapping matches it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
# Dev seed data is opt-in (D27): only FLYWAY_LOCATIONS=classpath:db/migration,classpath:db/devdata
# loads it. Production leaves FLYWAY_LOCATIONS unset or migration-only.
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}
# Lets a database that once loaded the dev seed start without it. This skips validation for any
# repeatable migration that has gone missing, not only the seed, and the seed's rows stay.
spring.flyway.ignore-migration-patterns=*:future,repeatable:missing
# Our tables live in their own schema, apart from what hosts like Supabase keep in "public".
spring.flyway.schemas=incident
spring.datasource.hikari.schema=incident
spring.jpa.properties.hibernate.default_schema=incident

# Signs login tokens: base64, at least 32 bytes (openssl rand -base64 32). Blank means a random key
# per start, so tokens stop working on restart.
app.jwt.secret=${JWT_SECRET:}
# Creates the first admin when the database has no users (production has no dev seed). Ignored once
# any user exists.
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# Every timestamp is stored and compared in UTC.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Rate limits (D42, NFR-04.4)
app.rate-limit.login.capacity=${RATE_LIMIT_LOGIN_CAPACITY:5}
app.rate-limit.login.duration=${RATE_LIMIT_LOGIN_DURATION:60s}
app.rate-limit.webhook.capacity=${RATE_LIMIT_WEBHOOK_CAPACITY:50}
app.rate-limit.webhook.duration=${RATE_LIMIT_WEBHOOK_DURATION:1s}
app.rate-limit.max-buckets=${RATE_LIMIT_MAX_BUCKETS:10000}
app.rate-limit.trusted-proxies=${RATE_LIMIT_TRUSTED_PROXIES:}


