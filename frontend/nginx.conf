# Entry point of the Docker Compose stack (D41): serves the built UI and proxies the backend.
# Production uses Vercel and Render instead, so this file only runs in Docker.

# A second rate limit in front of the backend's own (D42), per client address.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=webhooks:10m rate=50r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    limit_req_status 429;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # React Router owns the paths; unknown routes fall back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The shell must always be fresh; the files it loads have hashed names and never change.
    location = /index.html {
        expires -1;
    }

    location /assets/ {
        expires 1y;
    }

    location /api/ {
        proxy_pass http://app:8080;
    }

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://app:8080;
    }

    location /webhooks/ {
        limit_req zone=webhooks burst=100 nodelay;
        proxy_pass http://app:8080;
    }
}
