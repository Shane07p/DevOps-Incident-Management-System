spring.application.name=incident-management

# Render (and similar hosts) tell the app which port to use through PORT.
server.port=${PORT:8080}

# Credentials come from the environment; nothing real belongs in this file.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/incident}
spring.datasource.username=${DB_USERNAME:incident}
spring.datasource.password=${DB_PASSWORD:incident}

# Flyway owns the schema. JPA only checks that the mapping matches it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
# db/devdata seeds dev users and the Payments service; production drops it with FLYWAY_LOCATIONS.
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/devdata}
# Our tables live in their own schema, apart from what hosts like Supabase keep in "public".
spring.flyway.schemas=incident
spring.datasource.hikari.schema=incident
spring.jpa.properties.hibernate.default_schema=incident

# Every timestamp is stored and compared in UTC.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
